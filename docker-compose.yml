# docker-compose.yml — Configuração BASE (Produção)
# Em produção: docker-compose -f docker-compose.yml up -d
# Em local: docker-compose up -d  (aplica override automaticamente)

services:
  app:
    image: ${CI_REGISTRY_IMAGE:-sigplan}:${CI_COMMIT_SHA:-latest}
    env_file: .env
    volumes:
      # Armazenamento local dos PDFs de "Resultados e Produtos" — persistido
      # no volume Docker, sem depender de serviços ou infra externos.
      - resultados_data:/app/storage
    restart: unless-stopped

volumes:
  resultados_data:
