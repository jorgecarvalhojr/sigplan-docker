# docker-compose.yml — Configuração BASE (usada apenas em desenvolvimento local)
# Em local: docker-compose up -d  (aplica override automaticamente)
#
# Produção e homologação não usam mais este arquivo: o deploy é feito via
# ArgoCD/Kubernetes (ver .gitlab-ci.yml), que gerencia o Deployment com suas
# próprias secrets/configmaps e volumes persistentes no cluster.

services:
  app:
    image: ${CI_REGISTRY_IMAGE:-sigplan}:${CI_COMMIT_SHA:-latest}
    env_file: .env
    volumes:
      # Armazenamento local dos PDFs de "Resultados e Produtos" — persistido
      # no volume Docker, sem depender de serviços ou infra externos.
      - resultados_data:/app/storage
      - logs_data:/app/logs
    restart: unless-stopped

volumes:
  resultados_data:
  logs_data:
