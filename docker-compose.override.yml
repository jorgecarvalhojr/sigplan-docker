# docker-compose.override.yml — Override LOCAL (aplicado automaticamente)
# Adiciona PostgreSQL local e configura app para build+hot-reload.
# Em produção, rodar: docker-compose -f docker-compose.yml up -d (ignora este arquivo)

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sigplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sigplan123}
      POSTGRES_DB: ${POSTGRES_DB:-sigplan}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sigplan} -d ${POSTGRES_DB:-sigplan}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    # Override: build local em vez de usar imagem do registry
    build:
      context: .
      dockerfile: Dockerfile
    image: sigplan:dev
    env_file: .env.local
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Nota: hot-reload via volume só funciona com `next dev`.
    # Para dev com hot-reload, prefira rodar `npm run dev` fora do Docker
    # e usar apenas postgres + minio em container.

volumes:
  postgres_data:
