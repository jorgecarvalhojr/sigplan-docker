variables:
  ARGOCD_PROJECT: ${ARGOCD_PROJECT}
  CONTAINER_NAME: ${CONTAINER_NAME}

stages:
  - build
  - deploy

# ─────────────────────────────────────────────
# BUILD — Kaniko builda a imagem e envia ao registry do GitLab.
# Sem docker-compose/SSH: o deploy é feito pelo ArgoCD, que gerencia o
# Deployment no Kubernetes (env vars via Secret/ConfigMap próprios do
# cluster, fora deste repositório). Mesmo padrão usado pelo GECAD.
# ─────────────────────────────────────────────
.build_template:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" > /kaniko/.docker/config.json
    - echo -n $REGISTRY_CA_CERT | base64 -d > /kaniko/ssl/certs/additional-ca-cert-bundle.crt
    - |
      /kaniko/executor \
        --context $CI_PROJECT_DIR \
        --dockerfile $CI_PROJECT_DIR/Dockerfile \
        --destination $CI_REGISTRY_IMAGE/$CONTAINER_NAME:${CI_COMMIT_REF_NAME} \
        --single-snapshot \
        --use-new-run \
        --compressed-caching=false \
        --cache=false \
        --cleanup
  tags:
    - ubuntu-docker-dev

# ─────────────────────────────────────────────
# DEPLOY — Aciona o ArgoCD para reiniciar o Deployment e puxar a imagem
# recém publicada (imagePullPolicy: Always no manifesto do cluster).
# allow_failure: o restart pode falhar por permissão RBAC do usuário no
# ArgoCD (mesmo comportamento observado no GECAD) sem impedir que o
# cluster sincronize a nova imagem por conta própria — não deixamos isso
# travar o pipeline.
# ─────────────────────────────────────────────
.deploy_template:
  stage: deploy
  image: argoproj/argocd
  script:
    - argocd --grpc-web login "${TARGET_ARGOCD_SERVER}" --insecure --username "${ARGOCD_USERNAME}" --password "${ARGOCD_PASSWORD}"
    - argocd --grpc-web app actions run "${ARGOCD_PROJECT}" restart --kind Deployment --resource-name "${ARGOCD_PROJECT}"
  tags:
    - ubuntu-docker-dev
  allow_failure: true

# ----------------------------------------
# Jobs para Develop (Homologação)
# ----------------------------------------
build-dev:
  extends: .build_template
  only:
    - develop

deploy-dev:
  extends: .deploy_template
  variables:
    TARGET_ARGOCD_SERVER: ${ARGOCD_DEV_SERVER}
  needs: [build-dev]
  only:
    - develop

# ----------------------------------------
# Jobs para Produção (Main)
# ----------------------------------------
build-prod:
  extends: .build_template
  only:
    - main

deploy-prod:
  extends: .deploy_template
  variables:
    TARGET_ARGOCD_SERVER: ${ARGOCD_PROD_SERVER}
  needs: [build-prod]
  only:
    - main
  when: manual
