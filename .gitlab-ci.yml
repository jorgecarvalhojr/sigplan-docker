stages:
  - build
  - deploy-local
  - deploy-prod

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

# ─────────────────────────────────────────────
# BUILD — Constrói e envia imagem para o registry GitLab
# Ativado em: develop e main
# ─────────────────────────────────────────────
build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  only:
    - main
    - develop

# ─────────────────────────────────────────────
# DEPLOY LOCAL — Ambiente de homologação local
# Ativado em: develop (automático)
# Variáveis GitLab: ambiente "local"
# ─────────────────────────────────────────────
deploy-local:
  stage: deploy-local
  image: alpine:latest
  environment:
    name: local
  before_script:
    - apk add --no-cache gettext docker-compose
  script:
    # DEV_DB_HOST é cadastrada separada de PROD_DB_HOST no GitLab (hosts distintos);
    # o template espera DB_HOST, então mapeamos aqui antes do envsubst.
    - export DB_HOST="$DEV_DB_HOST"
    # Gera .env a partir do template com variáveis do GitLab
    - envsubst < .env.template > .env
    # Sobe apenas os serviços de base (sem postgres — só em prod local)
    # Para local com postgres em Docker, o override.yml é aplicado manualmente
    - docker-compose -f docker-compose.yml pull app
    - docker-compose -f docker-compose.yml up -d --no-build
  only:
    - develop

# ─────────────────────────────────────────────
# DEPLOY PRODUÇÃO — Servidor externo via SSH
# Ativado em: main (manual)
# Variáveis GitLab: ambiente "production"
# ─────────────────────────────────────────────
deploy-prod:
  stage: deploy-prod
  image: alpine:latest
  environment:
    name: production
  before_script:
    - apk add --no-cache openssh-client gettext
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    # PROD_DB_HOST é cadastrada separada de DEV_DB_HOST no GitLab (hosts distintos);
    # o template espera DB_HOST, então mapeamos aqui antes do envsubst.
    - export DB_HOST="$PROD_DB_HOST"
    # Gera .env local com variáveis do ambiente production
    - envsubst < .env.template > .env.prod
    # Copia arquivos necessários para o servidor
    - scp .env.prod $PROD_USER@$PROD_HOST:$PROD_DIR/.env
    - scp docker-compose.yml $PROD_USER@$PROD_HOST:$PROD_DIR/docker-compose.yml
    # Login no registry e deploy no servidor
    - |
      ssh $PROD_USER@$PROD_HOST "
        cd $PROD_DIR &&
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        docker-compose -f docker-compose.yml pull &&
        docker-compose -f docker-compose.yml up -d --remove-orphans &&
        docker image prune -f
      "
  only:
    - main
  when: manual
